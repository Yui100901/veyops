services:
  veyops:
    build: .
    image: ${VEYOPS_IMAGE:-veyops:local}
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment: &veyops-environment
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_CLIENT: ${DATABASE_CLIENT:-sqlite}
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_PATH: /app/data/database/app.db
      DATA_DIR: /app/data
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set a persistent 64-character hex ENCRYPTION_KEY in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      WORKER_ENABLED: ${WORKER_ENABLED:-true}
      WORKER_CONCURRENCY: "1"
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      AI_PIPELINE_ANALYSIS: ${AI_PIPELINE_ANALYSIS:-false}
      VEYOPS_AUTO_DELIVERY_TRIGGERS: ${VEYOPS_AUTO_DELIVERY_TRIGGERS:-}
    volumes: &veyops-volumes
      - veyops-data:/app/data

  worker:
    profiles: [split-worker]
    image: ${VEYOPS_IMAGE:-veyops:local}
    restart: unless-stopped
    init: true
    command: ["node", "apps/api/dist/worker.js"]
    environment: *veyops-environment
    volumes: *veyops-volumes
    healthcheck:
      disable: true
    depends_on:
      veyops:
        condition: service_healthy

volumes:
  veyops-data:
